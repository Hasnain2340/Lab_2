<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conference Registration Form</title>
</head>
<body>

    <h1> Conference Registration Form</h1>

    <form>
        <label> Full name:</label> <br>
        <input type="text" placeholder="Enter You full name"><br><br>

        <label> Email Address:</label><br>
        <input type="email" placeholder="Enter your email address"><br><br>

        <label> Age:</label> <br>
        <input type="number" placeholder="18"  min="18" max="99"> <br><br>

         <label>Gender:</label><br>
         <input type="radio" name="gender"
         value="Male"> Male<br>
         <input type="radio" name="gender"
         value="female"> Female<br><br>

         <label> Country Of Residence:</label><br>
         <select>

        <option> Malaysia</option>
        <option>Indonesia</option>
        <option>Pakistan</option>
        
         </select><br><br>

         <label> Areas of Interest:</label> <br>
         <input type="checkbox" value="Data Science"> data Science<br>
         <input type="checkbox" value="cybersecurity"> cybersecurity<br>
         <input type="checkbox"    value="AI"> Artificial intelligence<br><br>

         <label> Experience level:</label> <br>
         <input type="radio" name="experience"  value="Beginner"> Beginner<br>
         <input type="radio" name="experience" value="intermediate"> intermediate<br>
         <input type="radio" name="experience" value="Advanced"> Advanced<br><br>

         <label> Commments or Questions:</label><br>
         <textarea style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;" rows="4" cols="40" placeholder="Any comments or questions?"></textarea><br><br>

         <button type="submit"> register</button>
         <button type="reset"> Reset</button>
    </form>
    
</body>
</html>
